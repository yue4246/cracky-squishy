<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f5e6d3" />
    <title>脆皮捏捏捏 · by yue</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene" tabindex="0" role="application" aria-label="捏捏玩具。方向键移动触点，空格按压，松开空格保留凹陷。" aria-describedby="keyboard-help"></canvas>
      <div id="grain" aria-hidden="true"></div>
      <header class="brand"><span>脆皮捏捏捏</span><small>by yue</small></header>
      <section id="intro" class="intro">
        <div class="intro__copy">
          <p class="intro__kicker">给自己一点软软的时间</p>
          <h1>捏一捏，听脆皮裂开</h1>
          <p class="intro__hint">轻触小裂口，稍按裂得更开<br>在同一个地方，慢慢揉捏柔软内芯</p>
        </div>
        <button type="button" id="start-btn" class="intro__hit">轻触开始</button>
        <p class="intro__note">戴上耳机，听见每一小片脆响</p>
      </section>
      <section id="controls" class="controls" aria-label="玩具控制" hidden>
        <div class="controls-main">
          <div class="character-picker">
            <button id="previous" aria-label="上一个玩具" title="更换玩具会重置">‹</button>
            <label class="sr-only" for="character">选择玩具（更换后重置）</label>
            <select id="character"></select>
            <button id="next" aria-label="下一个玩具" title="更换玩具会重置">›</button>
          </div>
          <div class="actions">
            <button id="reset">换一只新的</button>
            <button id="sound" aria-pressed="true">声音已开启</button>
            <button id="retry" hidden>重新加载素材</button>
          </div>
          <p id="material-note" class="audio-status"></p>
          <p id="audio-status" class="audio-status" role="status"></p>
        </div>
        <button type="button" id="catalog-open" aria-label="打开捏捏图册" title="打开捏捏图册">
          <img src="./ui/cookie-book.png" alt="" />
          <span>捏捏图册</span>
        </button>
      </section>
      <p id="streak-note" hidden></p>
    <aside class="dessert-dock" aria-label="甜品与收藏">
        <div class="dessert-entry">
          <img class="dessert-icon" src="./ui/dessert-lid.svg" alt="可爱涂鸦饭盒" />
          <div class="dessert-copy"><strong>今日甜品盲盒</strong><small>每天一盒 · 藏着软软的小惊喜</small><button type="button" id="mystery-view" hidden>看看甜品 ↗</button></div>
          <button type="button" id="mystery-open">打开饭盒</button>
        </div>
        <small id="mystery-note" role="status"></small>
        <button type="button" id="cabinet-open">我的捏捏柜 <span aria-hidden="true">↗</span></button>
        <small id="storage-note" role="status" hidden></small>
      </aside>
      <dialog id="mystery-dialog" aria-labelledby="mystery-title">
        <button type="button" id="mystery-close" aria-label="关闭甜品盲盒">×</button>
        <p class="dessert-eyebrow">A LITTLE SWEET SURPRISE</p>
        <h2 id="mystery-title" aria-live="polite">今天的甜品，会是谁？</h2>
        <div id="mystery-stage">
          <div id="mystery-parcel" aria-hidden="true"><div class="lunchbox-base"></div><img class="lunchbox-lid" src="./ui/dessert-lid.svg" alt="" /></div>
          <img id="mystery-image" width="200" height="200" alt="" />
        </div>
        <div id="mystery-result" hidden>
          <p id="mystery-name"></p>
          <p id="mystery-saved">这份小甜品，已经住进你的捏捏柜</p>
          <button type="button" id="mystery-play">现在去捏</button>
        </div>
      </dialog>
      <dialog id="cabinet-dialog" aria-labelledby="cabinet-title">
        <button type="button" id="cabinet-close" aria-label="关闭捏捏柜">×</button>
        <h2 id="cabinet-title">我的捏捏柜</h2>
        <p id="cabinet-note" role="status"></p>
        <div id="cabinet-list"></div>
        <section id="cabinet-detail" hidden></section>
      </dialog>
      <dialog id="catalog-dialog" aria-labelledby="catalog-title">
        <div class="catalog-book">
          <button type="button" id="catalog-close" aria-label="关闭捏捏图册">×</button>
          <header><p>SQUISHY COOKIE BOOK</p><h2 id="catalog-title">捏捏图册</h2><small id="catalog-note" role="status"></small></header>
          <div id="catalog-list"></div>
        </div>
      </dialog>
      <p id="status" class="status" role="status" hidden>玩具准备中…</p>
      <p id="keyboard-help" class="keyboard-help">鼠标／普通触屏：短按轻、稍按重 · 压感笔：按实际力度 · 拖动揉捏</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
